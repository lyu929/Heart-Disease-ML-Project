[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heartrisk"
version = "1.0.0"
description = "Leakage-free heart-disease risk modelling: nested CV, calibration, decision curves, site-held-out validation and a FastAPI/Streamlit service."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Haolin Lyu" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "imbalanced-learn>=0.12",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
ui = ["streamlit>=1.32"]
torch = ["torch>=2.1"]
shap = ["shap>=0.44"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "pre-commit>=3.5", "httpx>=0.27"]
all = ["heartrisk[api,ui,torch,shap,dev]"]

[project.scripts]
heartrisk = "heartrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heartrisk = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: longer end-to-end runs (deselect with -m 'not slow')",
    "torch: tests that need PyTorch",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501", "B008", "B905"]

[tool.coverage.run]
source = ["heartrisk"]
